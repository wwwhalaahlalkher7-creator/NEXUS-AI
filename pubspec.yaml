name: nexus_app
description: Local-first personal distributed AI platform.
publish_to: none
version: 2.6.2+43
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.0
  sqflite: ^2.4.2
  flutter_rust_bridge: 2.13.0
  path: ^1.9.1
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.5.0
  qr: ^4.0.1
  rust_lib_nexus_app:
