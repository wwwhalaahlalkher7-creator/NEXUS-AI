[workspace]
resolver = "2"
members = [
    "core/shared",
    "core/runtime",
    "core/bridge",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.9.4"

[workspace.lints.rust]
# Unsafe code is denied by default. The narrowly scoped Android loader module
# opts in locally and documents each ABI call.
unsafe_code = "deny"
