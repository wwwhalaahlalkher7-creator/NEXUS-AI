name: NEXUS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Rust + Flutter and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Verify toolchains
        run: |
          flutter --version
          dart --version
          rustc --version
          cargo --version
          java -version

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Create Android project scaffold
        run: |
          # Generate only the Android host project in a temporary directory.
          # Do not run `flutter create` in the repository root: it can rewrite
          # the existing Dart application files and invalidate widget tests.
          scaffold_dir="$(mktemp -d)"
          flutter create --platforms=android --org com.nexusai --project-name nexus_app "$scaffold_dir"
          rm -rf android
          cp -a "$scaffold_dir/android" ./android
          rm -rf "$scaffold_dir"

      - name: Configure Maven Central mirror fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mirror_url = "https://maven-central.storage-download.googleapis.com/maven2/"

          def configure_repositories(path: Path) -> None:
              if not path.is_file():
                  raise SystemExit(f"Generated Gradle file was not found: {path}")

              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              # Remove prior copies so reruns are idempotent.
              lines = [
                  line for line in lines
                  if mirror_url not in line
              ]

              updated = []
              maven_count = 0
              for line in lines:
                  if re.match(r"^\s*mavenCentral\(\)\s*(?://.*)?\r?\n?$", line):
                      indent = re.match(r"^\s*", line).group(0)
                      updated.append(
                          f'{indent}maven {{ url = uri("{mirror_url}") }}\n'
                      )
                      maven_count += 1
                  updated.append(line)

              if maven_count == 0:
                  raise SystemExit(f"No mavenCentral() repository found in {path}")

              path.write_text("".join(updated), encoding="utf-8")
              result = path.read_text(encoding="utf-8")
              if result.count(mirror_url) != maven_count:
                  raise SystemExit(f"Mirror verification failed for {path}")

              print(f"Configured {maven_count} Maven Central mirror(s) in {path}")

          import re

          # Plugin resolution is configured in settings.gradle.kts.
          # Application dependency resolution is configured in the root build.gradle.kts.
          configure_repositories(Path("android/settings.gradle.kts"))
          configure_repositories(Path("android/build.gradle.kts"))
          PY

      - name: Integrate and generate Flutter Rust Bridge
        run: |
          # FRB's integration template writes a sample lib/main.dart. Preserve
          # the real NEXUS entrypoint so the template cannot replace the app.
          cp lib/main.dart "$RUNNER_TEMP/nexus-main.dart"
          cp pubspec.yaml "$RUNNER_TEMP/nexus-pubspec.yaml"
          cp flutter_rust_bridge.yaml "$RUNNER_TEMP/nexus-frb-config.yaml"

          flutter_rust_bridge_codegen integrate --rust-crate-dir core/bridge

          # `integrate` may rewrite the bridge configuration for its sample
          # layout. Restore NEXUS's explicit paths before generating bindings.
          cp "$RUNNER_TEMP/nexus-frb-config.yaml" flutter_rust_bridge.yaml

          # Always generate from the checked-in NEXUS configuration, rather
          # than relying on whichever config the integration template leaves.
          flutter_rust_bridge_codegen --verbose generate --config-file flutter_rust_bridge.yaml

          cp "$RUNNER_TEMP/nexus-main.dart" lib/main.dart
          # Keep the repository's real dependency declarations authoritative.
          # The FRB sample integration must not replace SDK dependencies such
          # as flutter_test with an unconstrained pub.dev dependency.
          cp "$RUNNER_TEMP/nexus-pubspec.yaml" pubspec.yaml
          # The template's sample API is unrelated to NEXUS and imports a
          # generated greet method that this Rust crate intentionally lacks.
          rm -f lib/src/rust/api/simple.dart
          # FRB integration also adds a sample integration test for MyApp.
          # NEXUS uses NexusApp and does not use the generated sample test.
          rm -f integration_test/simple_test.dart
          rmdir integration_test 2>/dev/null || true
          # FRB also creates a sample integration-test driver that is not used by NEXUS.
          rm -f test_driver/integration_test.dart
          rmdir test_driver 2>/dev/null || true

      - name: Verify generated Flutter Rust Bridge bindings
        shell: bash
        run: |
          echo "Generated bridge files:"
          if [ -d lib/src/rust ]; then
            find lib/src/rust -maxdepth 4 -type f -print | sort
          else
            echo "lib/src/rust directory was not generated."
          fi
          test -s lib/src/rust/api.dart || {
            echo "::error::FRB did not generate lib/src/rust/api.dart. Check the codegen output above and flutter_rust_bridge.yaml."
            exit 1
          }
          test -s lib/src/rust/frb_generated.dart || {
            echo "::error::FRB did not generate lib/src/rust/frb_generated.dart."
            exit 1
          }

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Advisory Flutter analysis (non-blocking)
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug ARM64 APK (retry transient repository failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            if flutter build apk --debug --no-pub --target-platform android-arm64; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 30 seconds before retrying dependency downloads..."
              sleep 30
            fi
          done
          echo "APK build failed after 3 attempts."
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
