name: NEXUS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Rust + Flutter and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4

      - name: Restore pinned llama.cpp source
        id: llama-source-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: third_party/llama.cpp
          key: nexus-llama-source-v1-${{ runner.os }}-${{ runner.arch }}-cd959bae99ff4bed22bef2604f45241c09bbb8c8

      - name: Checkout pinned llama.cpp source
        if: steps.llama-source-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: cd959bae99ff4bed22bef2604f45241c09bbb8c8
          path: third_party/llama.cpp
          persist-credentials: false

      - name: Verify pinned llama.cpp source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C third_party/llama.cpp rev-parse HEAD)"
          expected="cd959bae99ff4bed22bef2604f45241c09bbb8c8"
          test "$actual" = "$expected"
          echo "llama.cpp source revision verified: $actual"

      - name: Save pinned llama.cpp source
        if: steps.llama-source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: third_party/llama.cpp
          key: nexus-llama-source-v1-${{ runner.os }}-${{ runner.arch }}-cd959bae99ff4bed22bef2604f45241c09bbb8c8

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache Cargo registry and compiled dependency artifacts. Tool binaries
      # have a separate versioned cache below to avoid mixing cache ownership.
      - name: Cache Rust dependencies
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Fingerprint Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(rustc --version | sha256sum | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore FRB tool binaries
        id: frb-tools-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: nexus-frb-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.fingerprint }}-frb-2.13.0-expand-1.0.127

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install pinned Android NDK
        run: |
          sdkmanager --install "ndk;30.0.16248370"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          ndk_root="$sdk_root/ndk/30.0.16248370"
          {
            echo "ANDROID_NDK=$ndk_root"
            echo "ANDROID_NDK_HOME=$ndk_root"
            echo "ANDROID_NDK_ROOT=$ndk_root"
          } >> "$GITHUB_ENV"
          test -f "$ndk_root/build/cmake/android.toolchain.cmake"

      - name: Fingerprint Android native build toolchain
        id: native-toolchain
        shell: bash
        run: |
          set -euo pipefail
          clang="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          clangxx="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -x "$clang"
          test -x "$clangxx"
          fingerprint="$({
            "$clang" --version | sed -n '1p'
            "$clangxx" --version | sed -n '1p'
            cmake --version | sed -n '1p'
            ninja --version
            printf '%s\n' \
              'ndk=30.0.16248370' \
              'abi=arm64-v8a' \
              'android-api=28' \
              'llama.cpp=cd959bae99ff4bed22bef2604f45241c09bbb8c8'
          } | sha256sum | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Native toolchain cache fingerprint: $fingerprint"

      - name: Restore llama.cpp Android CMake cache
        id: llama-cmake-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/llama-android
            native/llama
          # Cache native sources with the build tree so their mtimes survive
          # checkout; otherwise Ninja would rebuild them on every fresh runner.
          # Bump cmake-v1 whenever any CMake -D flags change. No broad fallback.
          key: nexus-llama-cmake-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.fingerprint }}-${{ hashFiles('native/llama/**') }}

      - name: Verify toolchains
        run: |
          flutter --version
          dart --version
          rustc --version
          cargo --version
          java -version

      - name: Ensure cached Flutter Rust Bridge build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v flutter_rust_bridge_codegen >/dev/null 2>&1; then
            cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          else
            echo "Using cached $(flutter_rust_bridge_codegen --version)"
          fi
          # FRB invokes cargo-expand during code generation. Pin and install it
          # explicitly so the versioned FRB tool cache can reuse it later.
          if ! command -v cargo-expand >/dev/null 2>&1; then
            cargo install cargo-expand --version 1.0.127 --locked
          else
            echo "Using cached $(cargo-expand --version)"
          fi

      - name: Save FRB tool binaries
        if: steps.frb-tools-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: nexus-frb-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.fingerprint }}-frb-2.13.0-expand-1.0.127

      - name: Create Android project scaffold
        run: |
          # Generate only the Android host project in a temporary directory.
          # Do not run `flutter create` in the repository root: it can rewrite
          # the existing Dart application files and invalidate widget tests.
          scaffold_dir="$(mktemp -d)"
          flutter create --platforms=android --org com.nexusai --project-name nexus_app "$scaffold_dir"
          rm -rf android
          cp -a "$scaffold_dir/android" ./android
          rm -rf "$scaffold_dir"
          # The native libraries are compiled against Android API 28; keep the
          # app's declared minimum SDK aligned with that native requirement.
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          content = gradle.read_text()
          updated, replacements = re.subn(
              r"(?m)^(\s*)minSdk\s*=\s*(?:flutter\.minSdkVersion|\d+)\s*$",
              r"\g<1>minSdk = 28",
              content,
          )
          if replacements != 1:
              raise SystemExit(f"Expected one Flutter minSdk declaration, found {replacements}")
          gradle.write_text(updated)
          PY

      - name: Build llama.cpp native adapter for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          cmake -S native/llama -B build/llama-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DLLAMA_CPP_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/llama-install" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_IS_DEV=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF
          cmake --build build/llama-android --target nexus_llama_probe --parallel "$(nproc)"
          cmake --install build/llama-android --config Release

          jni_dir="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          install_dir="$GITHUB_WORKSPACE/build/llama-install/lib"
          mkdir -p "$jni_dir"

          probe="$(find "$install_dir" -maxdepth 1 -type f -name 'libnexus_llama_probe.so' -print -quit)"
          test -n "$probe"
          cp "$probe" "$jni_dir/libnexus_llama_probe.so"

          libcxx_shared="$(find "$ANDROID_NDK/toolchains/llvm/prebuilt" \
            -path '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' \
            -print -quit)"
          test -n "$libcxx_shared"
          cp "$libcxx_shared" "$jni_dir/libc++_shared.so"

          test -s "$jni_dir/libnexus_llama_probe.so"
          test -s "$jni_dir/libc++_shared.so"
          echo "Packaged native libraries:"
          ls -lh "$jni_dir"
          readelf -h "$jni_dir/libnexus_llama_probe.so" | grep -F 'AArch64'
          readelf -h "$jni_dir/libc++_shared.so" | grep -F 'AArch64'
          readelf -Ws "$jni_dir/libnexus_llama_probe.so" | grep -E 'nexus_llama_backend_init|nexus_llama_version'

          # Verify every non-platform dependency of the adapter is present in
          # the APK's JNI directory. System dependencies must exist in the NDK.
          sysroot_lib="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"
          python3 - "$jni_dir" "$sysroot_lib" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          jni_dir = Path(sys.argv[1])
          sysroot_lib = Path(sys.argv[2])
          packaged = {path.name for path in jni_dir.glob("*.so")}
          errors = []
          for library in sorted(jni_dir.glob("*.so")):
              result = subprocess.run(
                  ["readelf", "-d", str(library)],
                  check=True, capture_output=True, text=True
              )
              for dependency in re.findall(r"Shared library: \[(.*?)\]", result.stdout):
                  if dependency in packaged:
                      continue
                  if (sysroot_lib / dependency).is_file() or any(
                      candidate.is_file()
                      for candidate in sysroot_lib.glob(f"*/{dependency}")
                  ):
                      continue
                  errors.append(f"{library.name} requires missing {dependency}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("Native shared-library dependency closure verified.")
          PY

      - name: Save llama.cpp Android CMake cache
        if: steps.llama-cmake-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/llama-android
            native/llama
          key: nexus-llama-cmake-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.fingerprint }}-${{ hashFiles('native/llama/**') }}

      - name: Configure Maven Central mirror fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mirror_url = "https://maven-central.storage-download.googleapis.com/maven2/"

          def configure_repositories(path: Path) -> None:
              if not path.is_file():
                  raise SystemExit(f"Generated Gradle file was not found: {path}")

              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              # Remove prior copies so reruns are idempotent.
              lines = [
                  line for line in lines
                  if mirror_url not in line
              ]

              updated = []
              maven_count = 0
              for line in lines:
                  if re.match(r"^\s*mavenCentral\(\)\s*(?://.*)?\r?\n?$", line):
                      indent = re.match(r"^\s*", line).group(0)
                      updated.append(
                          f'{indent}maven {{ url = uri("{mirror_url}") }}\n'
                      )
                      maven_count += 1
                  updated.append(line)

              if maven_count == 0:
                  raise SystemExit(f"No mavenCentral() repository found in {path}")

              path.write_text("".join(updated), encoding="utf-8")
              result = path.read_text(encoding="utf-8")
              if result.count(mirror_url) != maven_count:
                  raise SystemExit(f"Mirror verification failed for {path}")

              print(f"Configured {maven_count} Maven Central mirror(s) in {path}")

          import re

          # Plugin resolution is configured in settings.gradle.kts.
          # Application dependency resolution is configured in the root build.gradle.kts.
          configure_repositories(Path("android/settings.gradle.kts"))
          configure_repositories(Path("android/build.gradle.kts"))
          PY

      - name: Integrate and generate Flutter Rust Bridge
        run: |
          # FRB's integration template writes a sample lib/main.dart. Preserve
          # the real NEXUS entrypoint so the template cannot replace the app.
          cp lib/main.dart "$RUNNER_TEMP/nexus-main.dart"
          cp pubspec.yaml "$RUNNER_TEMP/nexus-pubspec.yaml"
          cp flutter_rust_bridge.yaml "$RUNNER_TEMP/nexus-frb-config.yaml"
          cp core/bridge/Cargo.toml "$RUNNER_TEMP/nexus-bridge-Cargo.toml"
          cp core/bridge/src/lib.rs "$RUNNER_TEMP/nexus-bridge-lib.rs"
          cp -a core/bridge/src/api "$RUNNER_TEMP/nexus-bridge-api"

          flutter_rust_bridge_codegen integrate --integration-backend cargokit --rust-crate-dir core/bridge

          # `integrate` may rewrite the bridge configuration for its sample
          # layout. Restore NEXUS's explicit paths before generating bindings.
          cp "$RUNNER_TEMP/nexus-frb-config.yaml" flutter_rust_bridge.yaml
          cp "$RUNNER_TEMP/nexus-bridge-Cargo.toml" core/bridge/Cargo.toml
          cp "$RUNNER_TEMP/nexus-bridge-lib.rs" core/bridge/src/lib.rs
          rm -rf core/bridge/src/api
          cp -a "$RUNNER_TEMP/nexus-bridge-api" core/bridge/src/api

          # Always generate from the checked-in NEXUS configuration, rather
          # than relying on whichever config the integration template leaves.
          flutter_rust_bridge_codegen --verbose generate --config-file flutter_rust_bridge.yaml
          python3 scripts/allow_generated_ffi.py

          cp "$RUNNER_TEMP/nexus-main.dart" lib/main.dart
          # Keep the repository's real dependency declarations authoritative.
          # The FRB sample integration must not replace SDK dependencies such
          # as flutter_test with an unconstrained pub.dev dependency.
          cp "$RUNNER_TEMP/nexus-pubspec.yaml" pubspec.yaml
          # Keep lib/src/rust/api/simple.dart: it is the real NEXUS API
          # generated from core/bridge/src/api/simple.rs, not a disposable sample.
          # FRB integration also adds a sample integration test for MyApp.
          # NEXUS uses NexusApp and does not use the generated sample test.
          rm -f integration_test/simple_test.dart
          rmdir integration_test 2>/dev/null || true
          # FRB also creates a sample integration-test driver that is not used by NEXUS.
          rm -f test_driver/integration_test.dart
          rmdir test_driver 2>/dev/null || true
          # The generated Cargokit package must remain resolvable after the
          # NEXUS dependency manifest is restored.
          test -s rust_builder/pubspec.yaml
          grep -Fx 'name: rust_lib_nexus_app' rust_builder/pubspec.yaml
          grep -A1 -F '  rust_lib_nexus_app:' pubspec.yaml | grep -F 'path: rust_builder'

      - name: Verify generated Flutter Rust Bridge bindings
        shell: bash
        run: |
          echo "Generated bridge files:"
          if [ -d lib/src/rust ]; then
            find lib/src/rust -maxdepth 4 -type f -print | sort
          else
            echo "lib/src/rust directory was not generated."
          fi
          test -s lib/src/rust/api/simple.dart || {
            echo "::error::FRB did not generate lib/src/rust/api/simple.dart. Check the codegen output above, core/bridge/src/api/mod.rs, and flutter_rust_bridge.yaml."
            exit 1
          }
          test -s lib/src/rust/frb_generated.dart || {
            echo "::error::FRB did not generate lib/src/rust/frb_generated.dart."
            exit 1
          }
          test -s core/bridge/src/frb_generated.rs
          grep -B1 -F 'mod frb_generated;' core/bridge/src/lib.rs | grep -F '#[allow(unsafe_code)]'

      - name: Format and validate Rust workspace including generated FFI
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify standalone Material UI imports
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nF "package:flutter/material.dart" lib test; then
            echo "::error::Legacy Material imports are not allowed; use package:material_ui/material_ui.dart."
            exit 1
          fi
          if grep -R -nF "package:flutter_localizations/flutter_localizations.dart" lib test; then
            echo "::error::Use GlobalMaterialLocalizations from package:material_ui/material_ui.dart."
            exit 1
          fi
          grep -Eq '^  material_ui: \^1\.11\.0$' pubspec.yaml
          grep -Fq 'GlobalMaterialLocalizations.delegates' lib/main.dart

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Advisory Flutter analysis (non-blocking)
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug ARM64 APK (retry network failures only)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/nexus-apk-build-${attempt}.log"
            echo "APK build attempt ${attempt}/3"

            set +e
            flutter build apk --debug --no-pub --target-platform android-arm64 >"$log_file" 2>&1
            build_status=$?
            set -e
            cat "$log_file"

            if [ "$build_status" -eq 0 ]; then
              exit 0
            fi

            # Retry only known temporary repository/network failures. Compiler,
            # Kotlin, Dart, Rust, CMake and configuration errors stop immediately.
            if ! grep -Eiq \
              '(HTTP|status code|response code).*(408|429|5[0-9][0-9])|(408|429|5[0-9][0-9]).*(HTTP|response|gateway|rate limit)|Connection reset|Connection refused|Connection timed out|Read timed out|connect timed out|SocketException|UnknownHostException|Temporary failure in name resolution|Name or service not known|network is unreachable|No route to host|TLS handshake timeout|SSLHandshakeException|HandshakeException|remote host terminated the handshake|peer not authenticated|Could not resolve host|Could not GET .*[[:space:]](408|429|5[0-9][0-9])|Could not HEAD .*[[:space:]](408|429|5[0-9][0-9])' \
              "$log_file"; then
              echo "::error::APK build failed with a non-retryable error (exit $build_status)."
              exit "$build_status"
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "Transient network/repository failure detected; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "::error::APK build still fails after 3 network retries."
          exit 1

      - name: Verify llama.cpp libraries are packaged in the APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libnexus_llama_probe.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libc++_shared.so'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
